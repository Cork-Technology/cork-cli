# melange package spec for the single-binary `ch` (CLI + `ch mcp`) — the apk-repository channel
#. Built per release tag by .github/workflows/apk-repo.yml:
#   melange build packaging/melange.yaml --arch <native> --signing-key melange.rsa --generate-provenance
# which emits, per arch: cork-cli-X.Y.Z-rN.apk + its .attest.tar.gz SLSA provenance + APKINDEX.
#
# CI substitutes (yq) before building — placeholders are deliberately invalid so an unsubstituted
# build fails loudly instead of packaging the wrong source:
#   .package.version                     <- release tag without the leading v
#   .vars.commit                         <- the tag's commit sha
#   .vars.tag                            <- the release tag itself (vX.Y.Z[-rc.N])
#   .pipeline[0].with.expected-commit    <- the same sha (pins git-checkout)
#
# Each arch is built on its NATIVE runner (ubuntu-latest / ubuntu-24.04-arm): bun under qemu is
# slow and unproven, and native builds keep the determinism statement identical to the release
# binaries (same source, same wolfi bun 1.3.14 — pin asserted against mise.toml below).
package:
  name: cork-cli
  version: 0.0.0-SUBSTITUTED-BY-CI
  epoch: 0
  description: Cork Phoenix CLI (ch) and MCP stdio server, one self-contained binary
  copyright:
    - license: NOASSERTION # keep in lockstep with the cork-cli repo LICENSE
  # No explicit runtime deps: melange's SCA scans the ELF and declares the so: deps
  # (glibc, libstdc++, libgcc) automatically.

vars:
  commit: SUBSTITUTED-BY-CI
  # The git tag (vX.Y.Z[-rc.N]). package.version is the apk spelling (X.Y.Z_rcN), so it can
  # name neither the git tag nor the release identity compile-binaries.mjs stamps.
  tag: SUBSTITUTED-BY-CI

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      # CI rewrites this to `bun~<mise.toml pin>` (scripts/apk-spec-identity.sh): the resolver
      # then accepts only a Wolfi bun of the pinned version, and the exact -rN it picks lands in
      # the SLSA provenance. The assertion below re-checks the built-with version at build time.
      - bun
      - ca-certificates-bundle
      # git arrives via the git-checkout builtin pipeline's own dependency injection

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Cork-Technology/cork-cli
      tag: ${{vars.tag}}
      expected-commit: 0000000000000000000000000000000000000000

  - name: assert the wolfi bun matches the repo's pinned toolchain
    runs: |
      want="$(grep -E '^bun *= *"' mise.toml | head -1 | cut -d'"' -f2)"
      got="$(bun --version)"
      if [ "$want" != "$got" ]; then
        echo "wolfi bun $got != mise.toml pin $want — the runtime is embedded in the binary; refusing to drift" >&2
        exit 1
      fi

  - name: build the single binary (native arch)
    runs: |
      # The native install brings exactly this arch's HyperSync binding, which the build embeds.
      bun install --frozen-lockfile
      case "${{build.arch}}" in
        x86_64)  target=bun-linux-x64 ;;
        aarch64) target=bun-linux-arm64 ;;
        *) echo "unmapped arch ${{build.arch}}" >&2; exit 1 ;;
      esac
      # --native: no --target flag — the native build IS that target on wolfi (glibc), built by
      # wolfi's own bun. The release script owns the define set (build identity + the embedded
      # HyperSync binding for this target) so the apk cannot drift from the release binaries;
      # the target name still stamps identity, so `ch version` and self-update know the asset —
      # though an apk-installed /usr/bin/ch is root-owned, so self-update defers to `apk upgrade`.
      bun scripts/compile-binaries.mjs --native --targets "$target" \
        --version "${{vars.tag}}" --commit "${{vars.commit}}" --outdir out
      install -Dm755 "out/ch-${target#bun-}" "${{targets.destdir}}/usr/bin/ch"

  - name: smoke
    runs: |
      CORK_CONFIG_NO_FETCH=1 "${{targets.destdir}}/usr/bin/ch" version
      CORK_CONFIG_NO_FETCH=1 "${{targets.destdir}}/usr/bin/ch" capabilities >/dev/null
      # The binary must KNOW its HyperSync binding (the define reached it); whether that binding
      # loads is proven by the release smoke and the live-smoke test, which have network.
      CORK_CONFIG_NO_FETCH=1 "${{targets.destdir}}/usr/bin/ch" version --json | grep -F '"hyperSyncBinding": "@envio-dev/hypersync-client-linux-'

update:
  enabled: false # versions land via the release workflow, not a bot
