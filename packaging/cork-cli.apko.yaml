# apko image spec: minimal Wolfi image carrying the single-binary `ch` — composed FROM THE
# PUBLISHED GitHub Pages apk repository (not loose local files), so the image is a downstream
# consumer of the exact signed channel users get with `apk add cork-cli`.
#
# Published by .github/workflows/apk-repo.yml as ghcr.io/cork-technology/cork-cli:{vX.Y.Z,latest},
# multi-arch, SBOM-attached, image digest attested (gh attestation verify oci://…).
#
# MCP usage:  claude mcp add cork-defi -- docker run -i --rm ghcr.io/cork-technology/cork-cli mcp
# CLI usage:  docker run --rm ghcr.io/cork-technology/cork-cli query protocol-config --chainid 42161
contents:
  repositories:
    - https://packages.wolfi.dev/os
    - https://cork-technology.github.io/cork-cli/apk
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - https://cork-technology.github.io/cork-cli/melange.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    # glibc/libstdc++/libgcc arrive as cork-cli's SCA-declared runtime deps.
    - cork-cli

entrypoint:
  command: /usr/bin/ch

# The remote-config cache wants a writable HOME; run as nonroot with one.
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  HOME: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

archs:
  - x86_64
  - aarch64
