[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# via_ir: the JIT round-trip test has more locals than the stack allows without it.
via_ir = true
ffi = false

fs_permissions = [{ access = "read", path = "./order-artifact.json" }]
