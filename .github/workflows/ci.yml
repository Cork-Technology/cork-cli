# CI for the offline-deterministic gates [RFC 011 §14]. Network-gated suites (fork-parity,
# bundle-sim, rpc-live) self-skip without their env vars; the agent-eval runner (Layer B)
# self-skips without an Anthropic key — wire ANTHROPIC_API_KEY as a repo secret to enable it.
# Never put RPC endpoints in this file: CORK_TEST_RPC/CORK_RPC_URL are environment-only.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc strict)
        run: bun run typecheck

      - name: Tests (offline gates — examples, teaching, maturity, surface drift, venue/rollover/hypersync stubs)
        env:
          # Deterministic: never fetch cork-defaults.json from GitHub in CI.
          CORK_CONFIG_NO_FETCH: "1"
        run: bun run test

      - name: Mutation probes (bytes-critical logic — every catalogued mutant must be CAUGHT)
        env:
          CORK_CONFIG_NO_FETCH: "1"
        run: bun run test:mutation

      # Pinned-seed fast-check harnesses (numeric revert-parity + Fusion pricing invariants).
      # The public cork-cli tree deliberately carries no experiments/ — skip LOUDLY there, never
      # silently (bun test exits 0 on a no-match filter, which is exactly the failure mode this
      # step exists to prevent; test:prop asserts the harness files exist before running).
      - name: Property harnesses (test:prop)
        run: |
          if [ -d experiments/proptest ]; then
            bun run test:prop
          else
            echo "SKIP test:prop — experiments/ tree absent (public port); harnesses run in the private repo's CI"
          fi

      # The npm dist layout has its own gate script (scripts/verify-package-layout.mjs) that was
      # wired into no trigger — class C13: the published-package layout could rot while CI stayed
      # green. The melange/apko image pipeline builds compiled binaries, not this layout, so only
      # this step exercises it. build-packages.mjs runs under the runner's preinstalled Node
      # (the dist must be Node-runnable, so building it under Node is the honest environment).
      - name: Package layout (build + verify dist-only npm layout)
        run: bun run build && bun run verify:package

      - name: Lint — no machine-absolute paths in committed sources
        # /Users/<name> paths break every other checkout and the private→public port. notes/ is
        # private-tree prose and exempt. The character-class pattern keeps this step from
        # matching its own definition.
        run: |
          if git grep -n "/Users/[a-z]" -- ':!notes'; then
            echo "::error::machine-absolute path committed — use relative paths"
            exit 1
          fi

  # Live smoke on main pushes: continuous REAL-transport coverage for the RPC resolver — the
  # failover-wrapped client resolves the committed default and a real chainlist fallback (the one
  # code path the offline suite exercises only with injected transports). The registry-parity legs
  # self-skip (early return) when the sandbox read API is unreachable, so transient flake stays
  # green; a FAILURE here means real behavioral drift (e.g. the 2026-08-06 contracts_version
  # relabel) or resolver breakage. Deliberately NOT `-t`-filtered: a vitest name filter that
  # matches nothing exits 0 with everything skipped — the same green-no-op class test:prop closed.
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: RPC resolver + registry parity against the real network
        env:
          CORK_RPC_LIVE: "1"
        run: bunx vitest run packages/core/test/rpc-live.test.ts

  # Layer B agent evals (RFC §13/§14): runs the trace-graded task set when the key is present;
  # the runner prints a skip line and exits 0 otherwise, so forks/PRs without secrets stay green.
  agent-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    # Only on main pushes — eval runs cost real tokens; PRs get Layer A.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run agent evals (self-skips without ANTHROPIC_API_KEY)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_GATE: "1"
          EVAL_GATE_THRESHOLD: "0.8"
        run: bun run eval
