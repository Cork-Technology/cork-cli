# CI for the offline-deterministic gates [RFC 011 §14]. Network-gated suites (fork-parity,
# bundle-sim, rpc-live) self-skip without their env vars; the agent-eval runner (Layer B)
# self-skips without an Anthropic key — wire ANTHROPIC_API_KEY as a repo secret to enable it.
# Never put RPC endpoints in this file: CORK_TEST_RPC/CORK_RPC_URL are environment-only.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The mutation-probe step alone runs ~11-14 min at 254 probes (each probe re-runs the killer
    # suite); 15 was outgrown 2026-08-19 and cancelled three green trees in a row.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain from mise.toml — the ONE place the Bun version is pinned, the same Bun the release
      # builds embed (build-binaries.yml). A floating "1.3" here tested a runtime we do not ship.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc strict)
        run: bun run typecheck

      - name: Tests (offline gates — examples, teaching, maturity, surface drift, venue/rollover/hypersync stubs)
        env:
          # Deterministic: never fetch cork-defaults.json from GitHub in CI.
          CORK_CONFIG_NO_FETCH: "1"
        run: bun run test

      - name: Mutation probes (bytes-critical logic — every catalogued mutant must be CAUGHT)
        env:
          CORK_CONFIG_NO_FETCH: "1"
        run: bun run test:mutation

      # Pinned-seed fast-check harnesses (numeric revert-parity + Fusion pricing invariants).
      # The public cork-cli tree deliberately carries no experiments/ — skip LOUDLY there, never
      # silently (bun test exits 0 on a no-match filter, which is exactly the failure mode this
      # step exists to prevent; test:prop asserts the harness files exist before running).
      - name: Property harnesses (test:prop)
        run: |
          if [ -d experiments/proptest ]; then
            bun run test:prop
          else
            echo "SKIP test:prop — experiments/ tree absent (public port); harnesses run in the private repo's CI"
          fi

      # The npm dist layout has its own gate script (scripts/verify-package-layout.mjs) that was
      # wired into no trigger — class C13: the published-package layout could rot while CI stayed
      # green. The melange/apko image pipeline builds compiled binaries, not this layout, so only
      # this step exercises it. build-packages.mjs runs under the runner's preinstalled Node
      # (the dist must be Node-runnable, so building it under Node is the honest environment).
      - name: Package layout (build + verify dist-only npm layout)
        run: bun run build && bun run verify:package

      - name: Lint — no machine-absolute paths in committed sources
        # /Users/<name> paths break every other checkout and the private→public port. notes/ is
        # private-tree prose and exempt. The character-class pattern keeps this step from
        # matching its own definition.
        run: |
          if git grep -n "/Users/[a-z]" -- ':!notes'; then
            echo "::error::machine-absolute path committed — use relative paths"
            exit 1
          fi

  # Live smoke on main pushes: continuous REAL-transport coverage for the RPC resolver — the
  # failover-wrapped client resolves the committed default and a real chainlist fallback (the one
  # code path the offline suite exercises only with injected transports). The registry-parity legs
  # self-skip (early return) when the sandbox read API is unreachable, so transient flake stays
  # green; a FAILURE here means real behavioral drift (e.g. the 2026-08-06 contracts_version
  # relabel) or resolver breakage. Deliberately NOT `-t`-filtered: a vitest name filter that
  # matches nothing exits 0 with everything skipped — the same green-no-op class test:prop closed.
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain from mise.toml — the ONE place the Bun version is pinned, the same Bun the release
      # builds embed (build-binaries.yml). A floating "1.3" here tested a runtime we do not ship.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: RPC resolver + registry parity + venue negotiation contract against the real network
        env:
          CORK_RPC_LIVE: "1"
        run: bunx vitest run packages/core/test/rpc-live.test.ts packages/core/test/venue-live.test.ts

      # Compiles `ch` for this (glibc x64) host with the release script and proves the embedded
      # HyperSync binding gets past the native loader — the bare-image finding of 2026-08-20.
      - name: Compiled binary embeds + loads its HyperSync binding
        env:
          CORK_RPC_LIVE: "1"
        run: bunx vitest run packages/cli/test/compiled-binding-live.test.ts

  # Layer B agent evals (RFC §13/§14): runs the trace-graded task set when credentials resolve;
  # the runner prints a skip line and exits 0 otherwise, so forks/PRs without secrets stay green.
  # Preferred auth is Claude Platform on AWS via GitHub OIDC → SigV4 (no stored secret, nothing
  # to expire): set the CORK_EVALS_AWS_* repo VARIABLES below. ANTHROPIC_API_KEY stays as the
  # first-party-key alternative. Unset variables export as empty strings; the runner's auth-mode
  # treats empty as unset.
  agent-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    # Only on main pushes — eval runs cost real tokens; PRs get Layer A.
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write # mint the GitHub OIDC token the AWS role trust policy verifies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain from mise.toml — the ONE place the Bun version is pinned, the same Bun the release
      # builds embed (build-binaries.yml). A floating "1.3" here tested a runtime we do not ship.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Assume the evals AWS role (OIDC; skipped until the role variable is set)
        if: vars.CORK_EVALS_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.CORK_EVALS_AWS_ROLE_ARN }}
          aws-region: ${{ vars.CORK_EVALS_AWS_REGION }}

      - name: Run agent evals (self-skips without credentials)
        env:
          # Claude Platform on AWS (preferred): the workspace id switches the runner to the
          # AnthropicAws client; SigV4 credentials come from the assumed role above.
          ANTHROPIC_AWS_WORKSPACE_ID: ${{ vars.CORK_EVALS_AWS_WORKSPACE_ID }}
          AWS_REGION: ${{ vars.CORK_EVALS_AWS_REGION }}
          # First-party alternative: a console.anthropic.com key.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_GATE: "1"
          # 96 %: at most 2 of the 55 graded tasks may fail. The gate trips when
          # success/n < threshold, so the window that allows exactly 2 is
          # (52/55, 53/55] = (0.9455, 0.9636]; 0.96 sits inside it with margin at both ends.
          # NOTE: this is a RATIO. Adding tasks raises the failures it tolerates — at 80 tasks
          # 0.96 permits 3. Re-derive it when the task count changes.
          EVAL_GATE_THRESHOLD: "0.96"
        run: bun run eval
