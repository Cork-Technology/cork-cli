# Tag-driven single-binary release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Gate order: two INDEPENDENT builds of the same commit must produce byte-identical binaries
# (cross-runner determinism proof), the primary build's binaries must pass offline smoke on all
# three OS families, and only then is the release published — from the attested primary bytes.
#
# Repo settings this relies on:
#  - Immutable releases ENABLED (assets + tag locked at publish; every asset auto-attested).
#    A tag name is burned forever once released — rehearse on vX.Y.Z-rc.N tags.
#  - Actions can create releases (contents: write below).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Versioning policy R1: the version is written in one place (each package's manifest); every
  # copy — including this tag — is checked against it. A tag that disagrees fails the release.
  version-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must equal the in-source package version
        run: |
          want="${GITHUB_REF_NAME#v}"
          for p in packages/*/package.json; do
            have=$(node -p "require('./$p').version")
            if [ "$have" != "$want" ]; then
              echo "::error::$p says $have but the tag is $GITHUB_REF_NAME — bump the manifest or fix the tag (policy R1)"; exit 1
            fi
          done
          echo "all package manifests agree with $GITHUB_REF_NAME"

  build-primary:
    needs: version-gate
    uses: ./.github/workflows/build-binaries.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      version: ${{ github.ref_name }}
      attest: true
      artifact-name: binaries-primary

  # Same commit, second independent runner, no attestation — exists only to prove determinism.
  build-shadow:
    needs: version-gate
    uses: ./.github/workflows/build-binaries.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      version: ${{ github.ref_name }}
      attest: false
      artifact-name: binaries-shadow

  determinism:
    needs: [build-primary, build-shadow]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-primary
          path: primary
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-shadow
          path: shadow
      - name: Two independent builds must be byte-identical
        run: |
          diff primary/checksums.txt shadow/checksums.txt
          echo "deterministic: both runs agree on"
          cat primary/checksums.txt

  smoke:
    needs: determinism
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            asset: ch-linux-x64
          - os: ubuntu-24.04-arm
            asset: ch-linux-arm64
          - os: macos-latest
            asset: ch-darwin-arm64
          - os: windows-latest
            asset: ch-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-primary
          path: dist
      # Offline-only commands: no RPC flakiness may block a release. capabilities exercises the
      # full registry; protocol-config exercises the bundled-defaults path; version must echo the
      # tag that was stamped at compile time.
      - name: Smoke-test the compiled binary
        shell: bash
        env:
          CORK_CONFIG_NO_FETCH: "1"
          CORK_NO_UPDATE_NOTIFIER: "1"
        run: |
          chmod +x "dist/${{ matrix.asset }}" || true
          # No `tee /dev/stderr`: the device is absent in Windows git-bash and pipefail then
          # fails a passing check (observed on the v0.1.0-rc.1 rehearsal). Capture + grep instead.
          v="$("./dist/${{ matrix.asset }}" version)"
          printf '%s\n' "$v"
          printf '%s\n' "$v" | grep -F "${{ github.ref_name }}"
          "./dist/${{ matrix.asset }}" capabilities >/dev/null
          "./dist/${{ matrix.asset }}" query protocol-config --chainid 42161 >/dev/null
      - name: MCP stdio handshake
        shell: bash
        env:
          CORK_CONFIG_NO_FETCH: "1"
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}\n' \
            | "./dist/${{ matrix.asset }}" mcp | head -c 4096 | grep -F '"serverInfo"'

      # The embedded HyperSync binding: glibc Linux and macOS assets carry one and must get PAST
      # the native loader (a token that cannot be valid fails at the network/auth layer, never
      # with "could not load"); Windows has none and must say so. Either way a typed envelope.
      - name: HyperSync binding matches the target and loads
        shell: bash
        env:
          CORK_CONFIG_NO_FETCH: "1"
          CORK_NO_UPDATE_NOTIFIER: "1"
          ENVIO_API_TOKEN: release-smoke-not-a-real-token
        run: |
          "./dist/${{ matrix.asset }}" version --json | grep -F '"hyperSyncBinding"'
          out="$("./dist/${{ matrix.asset }}" query whitelisted-addresses --chainid 42161 --mode full-decentralized --json || true)"
          printf '%s\n' "$out" | head -c 1500; echo
          case "${{ matrix.asset }}" in
            *.exe) printf '%s\n' "$out" | grep -F 'carries no HyperSync binding' >/dev/null ;;
            *)     ! printf '%s\n' "$out" | grep -E 'could not load|carries no HyperSync binding' >/dev/null ;;
          esac

  publish:
    needs: [determinism, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-primary
          path: dist
      - name: Create the (immutable) release from the attested primary bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ github.ref_name }}" in *-*) PRE="--prerelease";; *) PRE="";; esac
          gh release create "${{ github.ref_name }}" $PRE \
            --verify-tag \
            --title "${{ github.ref_name }}" \
            --notes "Single-binary \`ch\` (CLI + \`ch mcp\` stdio server). Verify any asset with:
          \`\`\`
          gh attestation verify <asset> --repo ${{ github.repository }} --signer-workflow ${{ github.repository }}/.github/workflows/build-binaries.yml
          \`\`\`
          Reproduce: same commit, Bun pinned by mise.toml, \`bun scripts/compile-binaries.mjs --version ${{ github.ref_name }} --commit ${{ github.sha }}\` — checksums must match checksums.txt. One caveat: match your host's libc to the asset you verify (glibc assets on a glibc host, musl on musl) — for same-OS targets Bun embeds the HOST's libc flavor, so a musl host rebuilding \`ch-linux-x64\` gets a correct-but-different binary, a false mismatch (verified empirically: musl assets reproduce byte-identically from an independent musl machine).

          SDK: the \`cork-*.tgz\` assets are the npm-installable \`@cork/schemas\` + \`@cork/core\` + \`@cork/mcp\` packages, attested and checksummed like every other asset. Add the schemas AND core tarball URLs to your \`dependencies\` (core's dependency on schemas resolves to the sibling tarball; your lockfile pins the sha512). Install guide: docs/sdk.md." \
            dist/ch-* dist/cork-*.tgz dist/checksums.txt

  # apk-repository + OCI + Phala channel, called for EVERY release. Called DIRECTLY rather than
  # relying on `release: published`: a release created with the run's own GITHUB_TOKEN never
  # fires other workflows (Actions suppresses token-created event cascades), and the alternative
  # — a PAT or app token whose only job is to re-fire an event — is a standing credential with a
  # blast radius. A workflow_call needs no credential at all and makes the ordering an explicit
  # `needs:` edge on the same commit. Secrets: MELANGE_SIGNING_KEY and PHALA_CLOUD_API_KEY live
  # in the `release` environment (v*-only deployment rule + required reviewers), and apk-repo's
  # jobs declare `environment: release` — that declaration is the GATE (reviewer approval per
  # attempt) but it is NOT the transport: a CALLED workflow's jobs resolve environment secrets
  # only when the caller ALSO passes `secrets: inherit` (actions/runner#4453; proven live on the
  # v0.3.0-rc.1 run 2026-08-18 — the env-bound job read MELANGE_SIGNING_KEY as EMPTY without
  # it, twice). `inherit` here forwards only what this same-repo caller could already read; the
  # environment secrets still materialize solely inside jobs that pass the reviewer gate, and a
  # run from any non-tag ref cannot enter the environment at all. (A `uses:` job cannot declare
  # `environment:` itself — hence the declaration lives on the called jobs.)
  # The candidate split lives INSIDE apk-repo: candidates publish a docker/podman-pullable ghcr
  # image (:vX.Y.Z-rc.N, never :latest); the apk Pages repo and the Phala CVM deploy are
  # production-only.
  apk-repo:
    needs: publish
    uses: ./.github/workflows/apk-repo.yml
    secrets: inherit
    permissions:
      contents: write # gh-pages push
      packages: write # ghcr push
      id-token: write
      attestations: write
    with:
      tag: ${{ github.ref_name }}
