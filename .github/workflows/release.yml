# Tag-driven single-binary release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Gate order: two INDEPENDENT builds of the same commit must produce byte-identical binaries
# (cross-runner determinism proof), the primary build's binaries must pass offline smoke on all
# three OS families, and only then is the release published — from the attested primary bytes.
# The apk and image build (apk-repo.yml) runs BEFORE the publish job: every channel the Release
# body names exists before the Release is public. The CVM deploy (deploy-cvm.yml) runs after it.
#
# Repo settings this relies on:
#  - Immutable releases ENABLED (assets + tag locked at publish; every asset auto-attested).
#    A tag name is burned forever once released — rehearse on vX.Y.Z-rc.N tags.
#  - Actions can create releases (contents: write below).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Versioning policy R1: the version is written in one place (each package's manifest); every
  # copy — including this tag — is checked against it. A tag that disagrees fails the release.
  version-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Install the pinned graph validator dependencies
        run: bun install --frozen-lockfile
      - name: Admit the complete publication-last release graph
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/release-graph.ts
      - name: Admit the authenticated component release
        env:
          GH_TOKEN: ${{ secrets.CORK_GITHUB_TOKEN || github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: sh scripts/release-preflight.sh release
      - name: Tag must equal the in-source package version
        run: |
          want="${GITHUB_REF_NAME#v}"
          for p in packages/*/package.json; do
            have=$(bun -p "(await import('./$p')).default.version")
            if [ "$have" != "$want" ]; then
              echo "::error::$p says $have but the tag is $GITHUB_REF_NAME — bump the manifest or fix the tag (policy R1)"; exit 1
            fi
          done
          echo "all package manifests agree with $GITHUB_REF_NAME"

  build-primary:
    needs: version-gate
    uses: ./.github/workflows/build-binaries.yml
    secrets:
      CORK_GITHUB_TOKEN: ${{ secrets.CORK_GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    with:
      version: ${{ github.ref_name }}
      attest: true
      artifact-name: binaries-primary

  # Same commit, second independent runner, no attestation — exists only to prove determinism.
  build-shadow:
    needs: version-gate
    uses: ./.github/workflows/build-binaries.yml
    secrets:
      CORK_GITHUB_TOKEN: ${{ secrets.CORK_GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    with:
      version: ${{ github.ref_name }}
      attest: false
      artifact-name: binaries-shadow

  determinism:
    needs: [build-primary, build-shadow]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-primary
          path: primary
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-shadow
          path: shadow
      - name: Two independent builds must be byte-identical
        run: |
          diff primary/checksums.txt shadow/checksums.txt
          echo "deterministic: both runs agree on"
          cat primary/checksums.txt

  smoke:
    needs: determinism
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            asset: ch-linux-x64
          - os: ubuntu-24.04-arm
            asset: ch-linux-arm64
          - os: macos-latest
            asset: ch-darwin-arm64
          - os: windows-latest
            asset: ch-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-primary
          path: dist
      # Offline-only commands: no RPC flakiness may block a release. capabilities exercises the
      # full registry; protocol-config exercises the bundled-defaults path; version must echo the
      # tag that was stamped at compile time.
      - name: Smoke-test the compiled binary
        shell: bash
        env:
          CORK_CONFIG_NO_FETCH: "1"
          CORK_NO_UPDATE_NOTIFIER: "1"
        run: |
          chmod +x "dist/${{ matrix.asset }}" || true
          # No `tee /dev/stderr`: the device is absent in Windows git-bash and pipefail then
          # fails a passing check (observed on the v0.1.0-rc.1 rehearsal). Capture + grep instead.
          v="$("./dist/${{ matrix.asset }}" version)"
          printf '%s\n' "$v"
          printf '%s\n' "$v" | grep -F "${{ github.ref_name }}"
          "./dist/${{ matrix.asset }}" version --json | grep -F "\"repository\": \"$GITHUB_REPOSITORY\""
          "./dist/${{ matrix.asset }}" capabilities >/dev/null
          "./dist/${{ matrix.asset }}" query protocol-config --chainid 42161 >/dev/null
      - name: MCP stdio handshake
        shell: bash
        env:
          CORK_CONFIG_NO_FETCH: "1"
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}\n' \
            | "./dist/${{ matrix.asset }}" mcp | head -c 4096 | grep -F '"serverInfo"'

      # The embedded HyperSync binding: glibc Linux and macOS assets carry one and must get PAST
      # the native loader (a token that cannot be valid fails at the network/auth layer, never
      # with "could not load"); Windows has none and must say so. Either way a typed envelope.
      - name: HyperSync binding matches the target and loads
        shell: bash
        env:
          CORK_CONFIG_NO_FETCH: "1"
          CORK_NO_UPDATE_NOTIFIER: "1"
          ENVIO_API_TOKEN: release-smoke-not-a-real-token
        run: |
          "./dist/${{ matrix.asset }}" version --json | grep -F '"hyperSyncBinding"'
          out="$("./dist/${{ matrix.asset }}" query whitelisted-addresses --chainid 42161 --mode full-decentralized --json || true)"
          printf '%s\n' "$out" | head -c 1500; echo
          case "${{ matrix.asset }}" in
            *.exe) printf '%s\n' "$out" | grep -F 'carries no HyperSync binding' >/dev/null ;;
            *)     ! printf '%s\n' "$out" | grep -E 'could not load|carries no HyperSync binding' >/dev/null ;;
          esac

  # R5c: the line's config branch (config/<major>.<minor>, holding only cork-defaults.v2.json) is
  # updated from THIS tag before the release is published, so a fresh binary never fetches a 404
  # and falls back to its bundled copy silently. The job enforces the line invariant (no set key a
  # released binary knows may disappear) and fails the release otherwise. Commits are GitHub-signed
  # through the API. Hotfix path for an address change without a release: dispatch
  # config-branch.yml by hand with the main-branch commit as `ref` and the line.
  config-branch:
    needs: [determinism, smoke]
    uses: ./.github/workflows/config-branch.yml
    permissions:
      contents: write
    with:
      ref: ${{ github.sha }}

  # apk repository + OCI image, built for EVERY release and BEFORE the GitHub Release exists.
  # PUBLISH LAST (2026-10-02): the Release body names the image, and for a stable the apk
  # channel, as covered channels (policy G18). Until this date `publish` ran first and this
  # workflow after it; v0.6.1-rc.3 published a Release at 18:53 UTC and this workflow failed
  # one minute later, so the public, immutable record named an image that did not exist for
  # nine and a half hours. Nothing here reads the Release — it builds from the tag's source —
  # so the order is free, and now every covered channel exists before the Release is public.
  # A second effect: the `release` environment's reviewer approves BEFORE anything is public.
  #
  # Called DIRECTLY rather than through `release: published`: a release created with the run's
  # own GITHUB_TOKEN never fires other workflows (Actions suppresses token-created event
  # cascades), and the alternative — a PAT or app token whose only job is to re-fire an event —
  # is a standing credential with a blast radius. A workflow_call needs no credential at all and
  # makes the ordering an explicit `needs:` edge on the same commit. Secrets: MELANGE_SIGNING_KEY
  # lives in the `release` environment (v*-only deployment rule + required reviewers), and
  # apk-repo's melange-build declares `environment: release` — that declaration is the GATE
  # (reviewer approval per attempt) but it is NOT the transport: a CALLED workflow's jobs resolve
  # environment secrets only when the caller ALSO passes `secrets: inherit` (actions/runner#4453;
  # proven live on the v0.3.0-rc.1 run 2026-08-18 — the env-bound job read MELANGE_SIGNING_KEY as
  # EMPTY without it, twice). `inherit` here forwards only what this same-repo caller could
  # already read; the environment secrets still materialize solely inside jobs that pass the
  # reviewer gate, and a run from any non-tag ref cannot enter the environment at all. (A `uses:`
  # job cannot declare `environment:` itself — hence the declaration lives on the called jobs.)
  # The candidate split lives INSIDE apk-repo: candidates publish a docker/podman-pullable ghcr
  # image (:vX.Y.Z-rc.N, never :latest); the apk Pages repo is production-only.
  apk-repo:
    needs: [determinism, smoke, config-branch]
    uses: ./.github/workflows/apk-repo.yml
    secrets: inherit
    permissions:
      contents: write # gh-pages push
      packages: write # ghcr push
      id-token: write
      attestations: write
    with:
      tag: ${{ github.ref_name }}

  # The GitHub Release — the LAST covered channel. It needs apk-repo: by the time this job runs,
  # the image (and for a stable the apk channel) is pushed and attested, so every channel the
  # body names exists. `gh release create` with assets creates a draft, uploads, and publishes;
  # the release attestation GitHub signs at that moment covers the tag object and every asset.
  publish:
    needs: [determinism, smoke, config-branch, apk-repo]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-primary
          path: dist
      - name: Record the image this release names, as a release asset
        env:
          IMAGE_DIGEST: ${{ needs.apk-repo.outputs.image-digest }}
          PUBLISHED_IMAGE: ${{ needs.apk-repo.outputs.image-name }}
          GH_TOKEN: ${{ secrets.CORK_GITHUB_TOKEN || github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # The release attestation covers the tag and the release ASSETS; the image has its own
          # build provenance but is no asset. This one-line file makes the same signed, immutable
          # record bind the image digest to the tag. A full sha256 digest or no release: an empty
          # value means apk-repo did not push what the body is about to claim.
          printf '%s' "$IMAGE_DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}' || { echo "::error::apk-repo handed over no image digest (got: '$IMAGE_DIGEST') — refusing to publish a Release that names an image nobody pushed"; exit 1; }
          sh scripts/release-preflight.sh publish > channel.txt
          image="$(grep '^image=' channel.txt | cut -d= -f2-)"
          [ "$image" = "$PUBLISHED_IMAGE" ] || { echo '::error::apk-repo image destination disagrees with the admitted component'; exit 1; }
          printf '%s:%s@%s\n' "$image" "$GITHUB_REF_NAME" "$IMAGE_DIGEST" > dist/image.txt
          cat dist/image.txt
      - name: Create the (immutable) release from the attested primary bytes
        env:
          GH_TOKEN: ${{ secrets.CORK_GITHUB_TOKEN || github.token }}
          GH_RELEASE_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PUBLISHED_IMAGE: ${{ needs.apk-repo.outputs.image-name }}
        run: |
          sh scripts/release-preflight.sh publish > channel.txt
          IMAGE_NAME="$(grep '^image=' channel.txt | cut -d= -f2-)"
          [ "$IMAGE_NAME" = "$PUBLISHED_IMAGE" ] || { echo '::error::apk-repo image destination disagrees with the admitted component'; exit 1; }
          # G9: while the component is pre-1.0 (v0.x.y) it is partner-preview — unaudited — so a bare
          # tag stays pre-release and never takes GitHub's Latest badge. Only a bare v1.0.0+ tag (the
          # first audited/production line) drops the flag. An -rc is always pre-release. Version is the
          # sole signal; no external flag.
          case "${{ github.ref_name }}" in v0.*|*-*) PRE="--prerelease";; *) PRE="";; esac
          LATEST=""
          case "$GITHUB_REPOSITORY" in Cork-Technology/cork-cli-private) LATEST="--latest=false" ;; esac
          # G18: a release names the channels its claims cover. A candidate publishes the ghcr image
          VERIFY_PREFIX=""
          case "$GITHUB_REPOSITORY" in Cork-Technology/cork-cli-private) VERIFY_PREFIX="GH_HOST=github.com GH_DEBUG= GH_TOKEN=\"\$CORK_GITHUB_TOKEN\" " ;; esac
          # only; a stable also publishes the apk repository. :latest moves only from a bare v1.0.0+
          # tag (apk-repo.yml, G9/R7) — the v0.5.0 body claimed it and was wrong (2026-09-04). The
          # two bodies must therefore not claim the same set, and neither may claim :latest below 1.0.
          case "${{ github.ref_name }}" in
            *-rc.*) CHANNELS="This release covers three:

          - the \`ch-*\` binaries,
          - the \`cork-*.tgz\` SDK packages,
          - the ghcr image \`$IMAGE_NAME:${{ github.ref_name }}\`.

          Every binary and tarball is attested and listed in \`checksums.txt\`. \`image.txt\` names the image by digest; the image was pushed and attested before this release was published. A candidate does not publish the apk repository or the \`:latest\` image — those are production only." ;;
            *)      CHANNELS="This release covers four:

          - the \`ch-*\` binaries,
          - the \`cork-*.tgz\` SDK packages,
          - the ghcr image \`$IMAGE_NAME:${{ github.ref_name }}\` (\`:latest\` is not moved: a v0.x partner-preview never takes it — only an audited v1.0.0+ stable will),
          - the apk repository channel, signed with the key committed as \`packaging/melange.rsa.pub\`.

          Every binary and tarball is attested and listed in \`checksums.txt\`. \`image.txt\` names the image by digest; the image and the apk channel were published before this release was. Each apk carries its own signature and SLSA provenance. One channel is excluded: the hosted MCP deployment is not covered by these checksums — verify it by its own image digest." ;;
          esac
          case "$GITHUB_REPOSITORY" in
            Cork-Technology/cork-cli-private)
              SDK_INSTALL="These assets are private. Set an explicit least-privilege CORK_GITHUB_TOKEN that can read this repository, then download, verify, and install local tarballs (never put a credential in a package URL):

          \`\`\`sh
          GH_HOST=github.com GH_DEBUG= GH_TOKEN=\"\$CORK_GITHUB_TOKEN\" gh release download $GITHUB_REF_NAME --repo $GITHUB_REPOSITORY --pattern 'cork-*.tgz'
          for asset in cork-*.tgz; do GH_HOST=github.com GH_DEBUG= GH_TOKEN=\"\$CORK_GITHUB_TOKEN\" gh attestation verify \"\$asset\" --repo \"$GITHUB_REPOSITORY\" --signer-workflow \"$GITHUB_REPOSITORY/.github/workflows/build-binaries.yml\" --source-ref refs/tags/$GITHUB_REF_NAME --source-digest $GITHUB_SHA; done
          \`\`\`

          Merge these local-file entries into your existing \`package.json\` (the overrides prevent transitive Cork dependencies from falling through to the unpublished npm versions):

          \`\`\`json
          {
            \"dependencies\": {
              \"@cork/schemas\": \"file:./cork-schemas-${GITHUB_REF_NAME#v}.tgz\",
              \"@cork/core\": \"file:./cork-core-${GITHUB_REF_NAME#v}.tgz\",
              \"@cork/mcp\": \"file:./cork-mcp-${GITHUB_REF_NAME#v}.tgz\"
            },
            \"overrides\": {
              \"@cork/schemas\": \"file:./cork-schemas-${GITHUB_REF_NAME#v}.tgz\",
              \"@cork/core\": \"file:./cork-core-${GITHUB_REF_NAME#v}.tgz\",
              \"@cork/mcp\": \"file:./cork-mcp-${GITHUB_REF_NAME#v}.tgz\"
            }
          }
          \`\`\`

          \`\`\`sh
          bun install --ignore-scripts
          \`\`\`

          Set \`CORK_GITHUB_TOKEN\` for authenticated private config and release reads; install \`gh\` for private self-update provenance verification, which uses the same explicit token. Log your container client into GHCR with read:packages access before pulling \`$IMAGE_NAME:$GITHUB_REF_NAME\`. This candidate has no Pages channel, latest alias, or hosted deployment." ;;
            *) SDK_INSTALL="The \`cork-*.tgz\` assets are the npm packages, attested and pinned by your lockfile's sha512. Verify the downloaded archives against this repository, builder, tag and source commit before installation. Merge dependencies AND overrides into your \`package.json\` so transitive Cork dependencies do not fall through to unpublished npm versions:

          \`\`\`json
          {
            \"dependencies\": {
              \"@cork/schemas\": \"https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/cork-schemas-${GITHUB_REF_NAME#v}.tgz\",
              \"@cork/core\": \"https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/cork-core-${GITHUB_REF_NAME#v}.tgz\",
              \"@cork/mcp\": \"https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/cork-mcp-${GITHUB_REF_NAME#v}.tgz\"
            },
            \"overrides\": {
              \"@cork/schemas\": \"https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/cork-schemas-${GITHUB_REF_NAME#v}.tgz\",
              \"@cork/core\": \"https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/cork-core-${GITHUB_REF_NAME#v}.tgz\",
              \"@cork/mcp\": \"https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/cork-mcp-${GITHUB_REF_NAME#v}.tgz\"
            }
          }
          \`\`\`" ;;
          esac
          GH_TOKEN="$GH_RELEASE_TOKEN" gh release create "${{ github.ref_name }}" $PRE $LATEST --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "${{ github.ref_name }}" \
            --notes "A frozen record of one version. Living docs: https://docs.cork.tech · other versions: the Releases page.

          ### The CLI

          \`ch\` is one binary — the CLI, and an MCP stdio server through \`ch mcp\`.

          - Put it on your PATH.
          - \`ch capabilities\` lists the 9 tools; \`ch <command> --help\` explains one.
          - Point an MCP client at \`ch mcp\`.
          - Example: \`ch query cork-pools --chain-id 8453\`

          Guide: [docs/cli.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/cli.md).

          ### The SDK

          \`@cork/core\` is the integrator library — a curated root export plus eight subpaths (\`/math\` \`/orders\` \`/registry\` \`/chain\` \`/bundle\` \`/venue\` \`/indexer\` \`/config\`):

          \`\`\`ts
          import { runTool } from '@cork/core'
          \`\`\`

          $SDK_INSTALL

          Guide: [docs/sdk.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/sdk.md).

          ### Channels

          $CHANNELS

          ### Verify

          \`\`\`
          ${VERIFY_PREFIX}gh attestation verify <asset> --repo ${{ github.repository }} --signer-workflow ${{ github.repository }}/.github/workflows/build-binaries.yml --source-ref refs/tags/${{ github.ref_name }} --source-digest ${{ github.sha }}
          \`\`\`

          Reproduce it with the same commit and the Bun pinned by mise.toml:

          \`\`\`
          bun scripts/compile-binaries.mjs --version ${{ github.ref_name }} --commit ${{ github.sha }} --repo ${{ github.repository }}
          \`\`\`

          The checksums must match \`checksums.txt\`. Match your host libc to the asset — glibc on glibc, musl on musl. For a same-OS target Bun embeds the host libc, so a musl host that rebuilds \`ch-linux-x64\` gets a correct but different binary.

          ### Compatibility

          The covered surface is the JSON output, the tool names, the input schemas, and the exit codes. This release can change that surface. The \`${GITHUB_REF_NAME#v}\` section of CHANGELOG.md lists every change under Breaking and Changed. Read those entries, then rebuild before you upgrade.

          Cork runs no on-chain deployment of this tool. This is a partner-preview release — unaudited and lightly reviewed; pin the Distribution you integrate against for its stream. A \`-rc\` tag is a release candidate; we flag it pre-release." \
            dist/ch-* dist/cork-*.tgz dist/checksums.txt dist/image.txt
          # A failed readback cannot roll back an immutable publication. Reconcile it before retrying.
          sh scripts/release-preflight.sh release-readback

  # The hosted MCP deployment — an EXCLUDED channel (the Release body says so), so it runs after
  # the Release and cannot hold it back: a Phala failure marks the run red and undoes nothing;
  # re-run this job alone. Production tags only. Its own reviewer gate (`environment: release`,
  # declared on the called job) asks exactly "run this attested digest on the production CVM".
  deploy-cvm:
    needs: [publish, apk-repo]
    if: ${{ github.repository == 'Cork-Technology/cork-cli' && needs.apk-repo.outputs.candidate == 'false' }}
    uses: ./.github/workflows/deploy-cvm.yml
    secrets: inherit
    permissions:
      contents: read
    with:
      image-digest: ${{ needs.apk-repo.outputs.image-digest }}
