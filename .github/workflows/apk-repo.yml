# apk-repository + OCI-image channel.
# Packages every release — candidates get the OCI image only; see the candidate split below:
#
#   1. melange builds the cork-cli apk from source at the tag, per NATIVE arch runner, with
#      --generate-provenance (SLSA provenance as .attest.tar.gz beside each apk) and a signed index.
#   2. The cumulative apk repository lives on the gh-pages branch and is served by GitHub Pages
#      (repo setting: Pages -> deploy from branch gh-pages, root). Published apks are immutable:
#      the job refuses to overwrite an existing package file.
#   3. apko composes the minimal Wolfi image FROM THE PUBLISHED Pages repo and pushes it to
#      ghcr.io/cork-technology/cork-cli, SBOM on, image digest attested.
#
# One-time setup this expects:
#   - `melange keygen` pair: private key in the MELANGE_SIGNING_KEY secret, public half committed
#     as packaging/melange.rsa.pub (also served at the Pages root for consumers).
#   - Pages enabled from the gh-pages branch.
#
# Three triggers, one gate:
#   - workflow_call from release.yml (the NORMAL path): a release published by the pipeline's own
#     GITHUB_TOKEN cannot fire `release: published` here (Actions suppresses token-created event
#     cascades), so the release workflow CALLS this one directly — no PAT/app token exists to
#     leak, the chain is an explicit `needs:` edge, and secrets arrive by name.
#   - release: published — still fires for a release a human publishes by hand.
#   - workflow_dispatch — operator backfill/retry (safe: the publish step refuses to overwrite
#     any already-published apk).
#   The candidate split (one discriminator everywhere: a `-` in the tag marks the candidate
#   space, the same rule release.yml uses for the prerelease flag):
#     - candidates (vX.Y.Z-rc.N) BUILD AND PUBLISH the OCI image (ghcr, :vX.Y.Z-rc.N tag only,
#       never :latest), composed from the locally-built signed apks — partners can docker/podman
#       pull a candidate without the apk repository ever carrying it.
#     - production tags additionally publish the apk to the cumulative Pages repository, compose
#       the image FROM that published channel, move :latest, and run the Phala CVM deploy.
#   apk version grammar has no hyphen: vX.Y.Z-rc.N maps to X.Y.Z_rcN (apk pre-release ordering
#   keeps it below X.Y.Z); any OTHER hyphen suffix fails loudly instead of guessing.
name: apk-repo

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "release tag to package (vX.Y.Z or vX.Y.Z-rc.N — candidates build the OCI image only)"
        required: true
        type: string
    secrets:
      MELANGE_SIGNING_KEY:
        required: true
      PHALA_CLOUD_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to package (vX.Y.Z or vX.Y.Z-rc.N — candidates build the OCI image only)"
        required: true
        type: string

permissions:
  contents: read

env:
  AQUA_CONFIG: packaging/aqua.yaml

jobs:
  # One resolution of tag → candidate? → apk version, consumed by every job below.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      candidate: ${{ steps.p.outputs.candidate }}
      apkver: ${{ steps.p.outputs.apkver }}
    steps:
      - id: p
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          test -n "$TAG" || { echo "::error::no tag resolved from the trigger"; exit 1; }
          v="${TAG#v}"
          case "$v" in
            *-rc.*) apkver="${v%%-rc.*}_rc${v##*-rc.}"; candidate=true ;;
            *-*)    echo "::error::unrecognized pre-release suffix in $TAG — only -rc.N maps to apk version grammar (policy R7 candidate space)"; exit 1 ;;
            *)      apkver="$v"; candidate=false ;;
          esac
          { echo "tag=$TAG"; echo "candidate=$candidate"; echo "apkver=$apkver"; } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG candidate=$candidate apkver=$apkver"

  melange-build:
    needs: plan
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5 (no bare v4 tag exists — the old @v4 could never resolve)
        with:
          aqua_version: v2.53.5

      - name: Install bubblewrap (melange build sandbox)
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap

      - name: Substitute release identity into the spec
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.apkver }}
        run: |
          # The checkout tag is substituted EXPLICITLY (candidates: package.version is the apk
          # mapping X.Y.Z_rcN, so the spec's default checkout tag of v + package.version would
          # name a git tag that does not exist).
          COMMIT="$(git rev-parse HEAD)" \
          yq -i '.package.version = strenv(VERSION) | .vars.commit = strenv(COMMIT) | .pipeline[0].with.tag = strenv(TAG) | .pipeline[0].with.expected-commit = strenv(COMMIT)' \
            packaging/melange.yaml
          yq '.package.version, .vars.commit, .pipeline[0].with.tag' packaging/melange.yaml

      - name: Build the apk (+ SLSA provenance, signed)
        env:
          MELANGE_SIGNING_KEY: ${{ secrets.MELANGE_SIGNING_KEY }}
        run: |
          umask 077 && printf '%s' "$MELANGE_SIGNING_KEY" > melange.rsa
          sudo -E "$(command -v melange)" build packaging/melange.yaml \
            --arch "${{ matrix.arch }}" \
            --signing-key melange.rsa \
            --generate-provenance \
            --out-dir packages
          rm -f melange.rsa
          ls -l "packages/${{ matrix.arch }}/"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-${{ matrix.arch }}
          path: packages/${{ matrix.arch }}/*.apk*
          if-no-files-found: error
          retention-days: 7

  publish-pages:
    # Production only: the cumulative apk repository is the partner channel; candidates never
    # enter it (their OCI images compose from the local build instead).
    needs: [plan, melange-build]
    if: ${{ needs.plan.outputs.candidate == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # pushes the gh-pages branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — main: for packaging/{aqua.yaml,melange.rsa.pub}
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5 (no bare v4 tag exists — the old @v4 could never resolve)
        with:
          aqua_version: v2.53.5

      - name: Check out (or initialize) the gh-pages apk repository
        run: |
          git fetch origin gh-pages && git worktree add site origin/gh-pages || {
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rf --quiet . 2>/dev/null || true
          }
          mkdir -p site/apk/x86_64 site/apk/aarch64

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apk-x86_64
          path: incoming/x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apk-aarch64
          path: incoming/aarch64

      - name: Add packages (immutably) and re-sign the index
        env:
          MELANGE_SIGNING_KEY: ${{ secrets.MELANGE_SIGNING_KEY }}
        run: |
          umask 077 && printf '%s' "$MELANGE_SIGNING_KEY" > melange.rsa
          for arch in x86_64 aarch64; do
            for f in incoming/$arch/*; do
              base="$(basename "$f")"
              if [ -e "site/apk/$arch/$base" ]; then
                echo "REFUSING to overwrite already-published $arch/$base — published apks are immutable (bump the epoch instead)" >&2
                exit 1
              fi
              cp "$f" "site/apk/$arch/$base"
            done
            # Regenerate the signed index over EVERYTHING published for the arch (cumulative repo).
            (cd "site/apk/$arch" && melange index -o APKINDEX.tar.gz --signing-key "$GITHUB_WORKSPACE/melange.rsa" ./*.apk)
          done
          rm -f melange.rsa
          cp packaging/melange.rsa.pub site/melange.rsa.pub

      - name: Publish (push gh-pages; Pages serves the branch)
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apk repo: add cork-cli $TAG"
          git push origin HEAD:gh-pages

  apko-publish:
    # Runs for EVERY release: candidates compose from the locally-built signed apks (the Pages
    # channel never carries them), production composes FROM the published Pages repo so the image
    # is a downstream consumer of the exact channel users `apk add` from.
    needs: [plan, melange-build, publish-pages]
    if: ${{ !cancelled() && needs.melange-build.result == 'success' && (needs.publish-pages.result == 'success' || needs.plan.outputs.candidate == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # ghcr push
      id-token: write
      attestations: write
    outputs:
      # The pushed image digest, for phala-deploy (and anyone else downstream).
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5 (no bare v4 tag exists — the old @v4 could never resolve)
        with:
          aqua_version: v2.53.5

      - name: Wait for Pages to serve the new package (production)
        if: ${{ needs.plan.outputs.candidate == 'false' }}
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          APKVER: ${{ needs.plan.outputs.apkver }}
        run: |
          url="https://cork-technology.github.io/cork-cli/apk/x86_64/APKINDEX.tar.gz"
          for i in $(seq 1 60); do
            if curl -fsSL "$url" | tar -Oxz APKINDEX 2>/dev/null | grep -q "V:${APKVER}"; then
              echo "Pages serves ${APKVER}"; exit 0
            fi
            echo "waiting for Pages deploy ($i/60)…"; sleep 15
          done
          echo "Pages never served ${APKVER}" >&2; exit 1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.plan.outputs.candidate == 'true' }}
        with:
          name: apk-x86_64
          path: packages/x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.plan.outputs.candidate == 'true' }}
        with:
          name: apk-aarch64
          path: packages/aarch64
      - name: Assemble the local signed repo (candidate)
        if: ${{ needs.plan.outputs.candidate == 'true' }}
        env:
          MELANGE_SIGNING_KEY: ${{ secrets.MELANGE_SIGNING_KEY }}
        run: |
          umask 077 && printf '%s' "$MELANGE_SIGNING_KEY" > melange.rsa
          for arch in x86_64 aarch64; do
            (cd "packages/$arch" && melange index -o APKINDEX.tar.gz --signing-key "$GITHUB_WORKSPACE/melange.rsa" ./*.apk)
          done
          rm -f melange.rsa
          # The image resolves cork-cli from ./packages instead of the Pages channel: swap the
          # spec's published repo/keyring for the local pair (the wolfi repo stays as-is).
          yq -i '(.contents.repositories[] | select(. == "https://cork-technology.github.io/cork-cli/apk")) = "./packages"' packaging/cork-cli.apko.yaml
          yq -i '(.contents.keyring[] | select(. == "https://cork-technology.github.io/cork-cli/melange.rsa.pub")) = "./packaging/melange.rsa.pub"' packaging/cork-cli.apko.yaml
          yq '.contents.repositories, .contents.keyring' packaging/cork-cli.apko.yaml

      - name: Pin the apk version in the apko spec
        env:
          APKVER: ${{ needs.plan.outputs.apkver }}
        run: |
          # An independent `apko build` of this spec must resolve the SAME package as this run —
          # pin cork-cli to the exact version-revision instead of floating on the index head.
          # (epoch is 0 in melange.yaml; a future epoch bump must be mirrored here.)
          PIN="cork-cli=${APKVER}-r0" \
          yq -i '(.contents.packages[] | select(. == "cork-cli")) = strenv(PIN)' packaging/cork-cli.apko.yaml
          yq '.contents.packages' packaging/cork-cli.apko.yaml

      - name: Build + push the image
        id: publish
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(echo "$GH_OWNER" | tr '[:upper:]' '[:lower:]')"
          # Candidates never move :latest (policy R7: the pointer tracks production only).
          refs=("ghcr.io/$owner/cork-cli:$TAG")
          [ "$CANDIDATE" = "false" ] && refs+=("ghcr.io/$owner/cork-cli:latest")
          apko login ghcr.io -u "${{ github.actor }}" -p "${{ github.token }}"
          apko publish packaging/cork-cli.apko.yaml "${refs[@]}" \
            --sbom-path sboms/ | tee digest.txt
          # apko prints the pushed ref with digest as the last line: capture for attestation.
          digest="$(grep -o 'sha256:[0-9a-f]\{64\}' digest.txt | tail -1)"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/$owner/cork-cli" >> "$GITHUB_ENV"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the image digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

  # Phala Cloud attestable deploy (Phase 2b of the remote-MCP plan): a CVM running the EXACT
  # attested image digest, name-keyed so re-deploys update in place. The compose is digest-pinned
  # (verification breaks on tags) and its runtime secrets live as encrypted CVM secrets in the
  # Phala dashboard — never in the compose or this workflow. Third-party verification:
  # packaging/VERIFY.md + scripts/verify-deployment.ts (six checks: quote signature, RTMR3
  # replay, compose-hash, digest pinning, gh attestation link to source).
  # Requires the PHALA_CLOUD_API_KEY secret; the determinism gate already ran before this
  # workflow's trigger (release.yml publishes only byte-identical, attested builds).
  phala-deploy:
    # Actual releases only — a candidate image never reaches the CVM; the attested production
    # digest is what packaging/VERIFY.md's six checks bind to.
    needs: [plan, apko-publish]
    if: ${{ !cancelled() && needs.plan.outputs.candidate == 'false' && needs.apko-publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Substitute the attested digest into the compose
        env:
          DIGEST: ${{ needs.apko-publish.outputs.digest }}
        run: |
          test -n "$DIGEST" || { echo "no image digest from apko-publish" >&2; exit 1; }
          sed "s|\${DIGEST}|$DIGEST|" packaging/phala-compose.yml > phala-compose.deploy.yml
          grep -q "@sha256:[0-9a-f]\{64\}" phala-compose.deploy.yml || { echo "compose image is not digest-pinned after substitution" >&2; exit 1; }
          grep "image:" phala-compose.deploy.yml

      - name: Deploy the CVM (name-keyed in-place update)
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          test -n "$PHALA_CLOUD_API_KEY" || { echo "PHALA_CLOUD_API_KEY secret is not set — see the blocked-on-owner list in packaging/VERIFY.md" >&2; exit 1; }
          # Exact-pinned + scripts disabled: this job holds PHALA_CLOUD_API_KEY, so a floating
          # `latest` here would hand deploy credentials to whoever ships the next phala release.
          # Bump deliberately, next to the lockfile pins.
          npm install -g --ignore-scripts phala@1.1.20
          phala deploy -c phala-compose.deploy.yml -n cork-mcp --wait
