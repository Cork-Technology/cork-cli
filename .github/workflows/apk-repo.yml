# apk-repository + OCI-image channel.
# Packages every release — candidates get the OCI image only; see the candidate split below:
#
#   1. melange builds the cork-cli apk from source at the tag, per NATIVE arch runner, with
#      --generate-provenance (SLSA provenance as .attest.tar.gz beside each apk) and a signed index.
#   2. The cumulative apk repository lives on the gh-pages branch and is served by GitHub Pages
#      (repo setting: Pages -> deploy from branch gh-pages, root). Published apks are immutable:
#      the job refuses to overwrite an existing package file.
#   3. apko composes the minimal Wolfi image FROM THE PUBLISHED Pages repo and pushes it to
#      ghcr.io/cork-technology/cork-cli, SBOM on, image digest attested.
#
# Toolchain sourcing (the wolfi-dev/os shape, zero sudo anywhere): every tool-running job —
# melange-build, publish, deploy-cvm — runs inside a digest-pinned cgr.dev/chainguard/wolfi-base
# job container and `apk add`s its tools from Wolfi's SIGNED repository — the supply chain for
# the whole build toolchain is one image digest plus one signing key the image already trusts.
# (The production publish path was the last to migrate, after its first real run on v0.4.0
# failed inside the aqua shim; on 2026-08-21 the candidate and production publish jobs became
# ONE job, `publish`.)
#
# One-time setup this expects:
#   - `melange keygen` pair: private key stored as MELANGE_SIGNING_KEY in the `release`
#     ENVIRONMENT (not a repo secret), public half committed as packaging/melange.rsa.pub (also
#     served at the Pages root for consumers).
#   - Pages enabled from the gh-pages branch.
#   - The `release` environment: deployment rule restricted to v* tags, required reviewers set.
#     Every secret-reading job below declares `environment: release` — the GATE: a run from any
#     other ref cannot enter it, and each job wave waits for a reviewer click that shows which
#     workflow and ref asked. On the workflow_call path the declaration is NOT the transport:
#     the caller must also pass `secrets: inherit` or the environment secrets resolve EMPTY
#     (actions/runner#4453; proven live on v0.3.0-rc.1, 2026-08-18). A production
#     release gates once for signing (melange-build, the only job that holds the key; it also
#     builds and signs the cumulative channel index) and once for the deploy (deploy-cvm: run
#     this attested digest on the production machine); publishing in between holds no secret
#     and asks nobody. A candidate gates once (melange-build). `plan` is deliberately ungated
#     so tag parsing fails fast before anyone is asked to approve.
#
# Three triggers, one gate:
#   - workflow_call from release.yml (the NORMAL path): a release published by the pipeline's own
#     GITHUB_TOKEN cannot fire `release: published` here (Actions suppresses token-created event
#     cascades), so the release workflow CALLS this one directly — no PAT/app token exists to
#     leak, and the chain is an explicit `needs:` edge. The caller passes `secrets: inherit`:
#     REQUIRED for environment secrets to resolve in a called workflow's jobs at all
#     (actions/runner#4453 — the env declaration alone reads empty; learned live 2026-08-18).
#     The environment gate above still decides WHERE they materialize: only inside
#     reviewer-approved jobs on v* refs. (A caller `uses:` job cannot declare `environment:`.)
#   - release: published — still fires for a release a human publishes by hand (the run's ref is
#     the tag, so the environment's v* rule passes).
#   - workflow_dispatch — operator backfill/retry (safe: the publish step refuses to overwrite
#     any already-published apk). Dispatch FROM THE TAG REF: the `release` environment rejects a
#     run whose ref is a branch, so "Run workflow" must select the vX.Y.Z tag, not main.
#     A dispatch runs THIS FILE AS IT IS AT THE CHOSEN REF. When a published tag carries a
#     broken workflow (v0.4.0's production-publish), the tag cannot be fixed: temporarily add
#     `main` to the environment's deployment rule, dispatch from main with the tag as input
#     (melange still checks out the TAG's source, so the package bytes are the tag's), approve
#     the gates, then remove `main` from the rule again.
#   The candidate split (one discriminator everywhere: a `-` in the tag marks the candidate
#   space, the same rule release.yml uses for the prerelease flag):
#     - candidates (vX.Y.Z-rc.N) BUILD AND PUBLISH the OCI image (ghcr, :vX.Y.Z-rc.N tag only,
#       never :latest), composed from the signed slices as a local repository — partners can
#       docker/podman pull a candidate without the apk repository ever carrying it.
#     - production tags additionally publish the slices to the cumulative Pages repository
#       (index built and signed in melange-build), compose the image FROM that published
#       channel, move :latest (v1.0.0+ only — a v0.x stable never does), and then — in the separately gated deploy-cvm job — deploy the
#       Phala CVM. Same `publish` job either way; the kind gates four steps and one tag.
#   apk version grammar has no hyphen: vX.Y.Z-rc.N maps to X.Y.Z_rcN (apk pre-release ordering
#   keeps it below X.Y.Z); any OTHER hyphen suffix fails loudly instead of guessing.
name: apk-repo

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "release tag to package (vX.Y.Z or vX.Y.Z-rc.N — candidates build the OCI image only)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to package (vX.Y.Z or vX.Y.Z-rc.N — candidates build the OCI image only)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # One resolution of tag → candidate? → apk version, consumed by every job below.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      candidate: ${{ steps.p.outputs.candidate }}
      apkver: ${{ steps.p.outputs.apkver }}
    steps:
      - id: p
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          test -n "$TAG" || { echo "::error::no tag resolved from the trigger"; exit 1; }
          v="${TAG#v}"
          case "$v" in
            *-rc.*) apkver="${v%%-rc.*}_rc${v##*-rc.}"; candidate=true ;;
            *-*)    echo "::error::unrecognized pre-release suffix in $TAG — only -rc.N maps to apk version grammar (policy R7 candidate space)"; exit 1 ;;
            *)      apkver="$v"; candidate=false ;;
          esac
          { echo "tag=$TAG"; echo "candidate=$candidate"; echo "apkver=$apkver"; } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG candidate=$candidate apkver=$apkver"

  melange-build:
    needs: plan
    environment: release # resolves MELANGE_SIGNING_KEY; v*-only + reviewer gate
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # The whole build toolchain enters through ONE digest-pinned wolfi-base image plus Wolfi's
    # SIGNED apk repository (the image already trusts its key) — replacing this job's former
    # aqua-installer action + aqua registry + GitHub-release binary downloads. This is where
    # wolfi-dev/os itself builds: root inside a container, which is exactly the condition
    # melange's bubblewrap runner wanted (it refused only the UNPRIVILEGED runner user, run
    # 32178646153 — root cause: Ubuntu 24.04's AppArmor unprivileged-userns restriction,
    # chainguard-dev/melange#1508. Chainguard's own setup-melange action instead patches
    # AppArmor via sudo and pulls melange as an unverified curl|tar from GitHub releases —
    # both edges this container shape exists to avoid, so we did not adopt those actions.)
    # Bump the digest deliberately: Chainguard's free tier tags only :latest, so
    # re-resolve and edit the pin here by hand (Dependabot's github-actions ecosystem does not
    # bump job-container images).
    container:
      image: cgr.dev/chainguard/wolfi-base@sha256:8e8fe4b9b989b03daaa4305dba54a1b480f63716c56dc6bb074e5a6057bf3c73
      # melange's documented in-docker shape (its own docs run the melange image with
      # --privileged): bubblewrap needs mount + namespace privileges, and the default
      # seccomp/AppArmor container profile blocks those even for in-container root. Scope
      # check: the runner VM is ephemeral and single-job, and the pre-Phase-A pipeline handed
      # this same power to sudo on the bare VM.
      options: --privileged
    timeout-minutes: 30
    steps:
      # Tools from Wolfi's signed repo, before anything else. bash first — it becomes the
      # default `run:` shell from the next step on (this one is sh, the image's busybox).
      # git before checkout — without it actions/checkout falls back to a REST tarball and
      # the later `git rev-parse HEAD` has no repository to ask.
      # diffutils: the tripwire's `cmp` — GNU, not a bet on which applets this wolfi-base
      # busybox build enables. libgcc + libstdc++: not for OUR tools — the runner mounts its
      # own node24 into the container to execute the JS actions (checkout, upload-artifact),
      # and that binary dynamically links libstdc++.so.6, which minimal wolfi-base does not
      # ship (checkout died on exactly that, run 32225158751).
      - name: Install the build toolchain (Wolfi signed apk repo)
        shell: sh
        run: |
          apk add --no-cache bash bubblewrap diffutils git libgcc libstdc++ melange openssl yq
          # The bind-mounted workspace belongs to the HOST runner user while container steps
          # run as root, so every git command in later run steps refuses with "dubious
          # ownership" — and on run 32225918023 that SILENTLY emptied both COMMIT (the
          # expected-commit supply-chain pin) and SOURCE_DATE_EPOCH, because the run stayed
          # green. Trust the workspace once, up front.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Stolen from chainguard-dev/actions/setup-melange: prove the sandbox works in seconds
      # — before the reviewer-gated tripwire and the multi-minute build — and emit
      # diagnostics when it does not. (Their probe verbatim, minus the sudo AppArmor host
      # mutation it exists to validate; here the container's --privileged is what's under test.)
      - name: Sandbox preflight — bwrap must work in this container
        run: |
          if ! bwrap --unshare-user --bind / / true; then
            echo "::error::bwrap cannot create its sandbox in this container — the job container's --privileged option (or the runner's userns policy) regressed"
            ls /proc/self/ns || echo "no /proc/self/ns"
            exit 1
          fi
          echo "bubblewrap sandbox OK"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - name: Substitute release identity into the spec
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.apkver }}
        run: |
          # One script owns the spec's release identity (tag, apk version, commit, and the Bun build
          # package pinned from mise.toml) and is unit-
          # tested against the current spec and the last pre-fix spec. COMMIT is resolved as a
          # PLAIN assignment plus an explicit guard — the old env-prefix form
          # (`COMMIT="$(...)" yq ...`) swallows a git failure even under `sh -e`, and on run
          # 32225918023 that silently ERASED the expected-commit pin while the run stayed green.
          COMMIT="$(git rev-parse HEAD)"
          test -n "$COMMIT" || { echo "::error::could not resolve HEAD — refusing to build without the expected-commit pin"; exit 1; }
          sh scripts/apk-spec-identity.sh packaging/melange.yaml "$TAG" "$VERSION" "$COMMIT"

      - name: Pub-key tripwire — the environment key must match the committed public half
        env:
          MELANGE_SIGNING_KEY: ${{ secrets.MELANGE_SIGNING_KEY }}
        run: |
          # packaging/melange.rsa.pub is the trust anchor: Pages serves it to apk consumers and
          # the apko keyring pins it. This step derives the public half from the environment key
          # and fails loudly when the two disagree — a swapped or rotated secret must never
          # self-certify a new trust root, and verifying signatures against a key derived from
          # the signer would prove nothing. melange keygen's .pub IS the SPKI PEM that
          # `openssl rsa -pubout` emits (verified byte-identical against melange 0.56.4).
          if [ -z "$MELANGE_SIGNING_KEY" ]; then
            echo "::error::MELANGE_SIGNING_KEY is not set in the 'release' environment (one-time setup: header of this file)"
            exit 1
          fi
          umask 077 && printf '%s' "$MELANGE_SIGNING_KEY" > tripwire.rsa
          if ! openssl rsa -in tripwire.rsa -pubout -out derived.rsa.pub 2>/dev/null; then
            rm -f tripwire.rsa
            echo "::error::the 'release' environment key does not parse as an RSA private key — wrong secret material"
            exit 1
          fi
          rm -f tripwire.rsa
          if [ ! -f packaging/melange.rsa.pub ]; then
            echo "::error::packaging/melange.rsa.pub is not committed. The public half derived from the environment key follows (public material) — commit it verbatim as packaging/melange.rsa.pub."
            cat derived.rsa.pub
            exit 1
          fi
          # Canonicalize the committed side too, so a whitespace or encoding edit cannot mask
          # a mismatch (or fake one).
          openssl pkey -pubin -in packaging/melange.rsa.pub -out committed.rsa.pub
          if ! cmp -s committed.rsa.pub derived.rsa.pub; then
            echo "::error::the 'release' environment signing key does NOT match the committed packaging/melange.rsa.pub. Do not publish — consumers verify apks against the committed half. Fix the secret, or rotate BOTH halves deliberately (rotation re-keys every consumer)."
            exit 1
          fi
          echo "signing key matches packaging/melange.rsa.pub"

      - name: Build the apk (+ SLSA provenance, signed)
        env:
          MELANGE_SIGNING_KEY: ${{ secrets.MELANGE_SIGNING_KEY }}
        run: |
          # An unset secret reaches the shell as an empty string, and melange then dies on a
          # 0-byte key file (observed: v0.1.0-rc.3, the first tag through this channel — then a
          # forwarded repo secret, now the `release` environment secret). Teach either way.
          if [ -z "$MELANGE_SIGNING_KEY" ]; then
            echo "::error::MELANGE_SIGNING_KEY is not set in the 'release' environment — one-time setup: 'melange keygen', store melange.rsa as an environment secret there, commit melange.rsa.pub as packaging/melange.rsa.pub (header of this file)"
            exit 1
          fi
          umask 077 && printf '%s' "$MELANGE_SIGNING_KEY" > melange.rsa
          # Stolen from the wolfi-dev/os Makefile (surfaced as the official actions'
          # source-date-epoch input): pin the build clock to the TAG COMMIT. melange stamps
          # file times and the package build_date from SOURCE_DATE_EPOCH, and the compiled
          # `ch` binary is already deterministic (release.yml's double-build gate) — so a
          # later re-dispatch has a real shot at rebuilding byte-identical apks, which is
          # exactly what production-publish's immutability check (cmp, refuse different
          # bytes) needs in order to pass on a partial-publish retry instead of bricking.
          # Plain assignment + guard, NOT `export X="$(...)"` — export returns 0 even when
          # the substitution fails, and run 32225918023 shipped an empty epoch that way.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          test -n "$SOURCE_DATE_EPOCH" || { echo "::error::could not read the tag commit's timestamp for SOURCE_DATE_EPOCH"; exit 1; }
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH (tag commit)"
          # bubblewrap, root-in-container (the wolfi-dev/os shape, still zero sudo — the
          # runner this job container exists to restore): as in-container root the bwrap
          # probe that refused the unprivileged runner user (run 32178646153) passes, and no
          # daemon socket is involved. The docker runner is NOT usable in here even though
          # the host socket is mounted: a sibling container's bind mounts resolve against
          # the HOST filesystem, where this job's /__w workspace path does not exist. The
          # flag stays EXPLICIT so an upstream default change cannot silently move the
          # isolation model.
          melange build packaging/melange.yaml \
            --runner bubblewrap \
            --arch "${{ matrix.arch }}" \
            --signing-key melange.rsa \
            --generate-provenance \
            --out-dir packages
          # `melange build` already generates AND signs the per-arch APKINDEX.tar.gz with the
          # same key (observed in the v0.3.0-rc.1 backfill log, 2026-08-18). That local index
          # is what CANDIDATES ship; production builds its CUMULATIVE index in the next step.
          ls -l "packages/${{ matrix.arch }}/"

      # The new apk joins the per-arch channel HERE, where the key already is, so the publish job
      # holds no secret and needs no reviewer click. Production merges against the PUBLISHED
      # channel: fetch it, apply the immutability rule (a byte-identical re-run is skipped;
      # different bytes REFUSE — published apks are immutable; first-published provenance wins,
      # because melange stamps wall-clock fields into it), add the new files, and sign ONE index
      # over everything; the gh-pages commit it indexed against rides beside the slice so the
      # publish job can refuse a stale merge. A candidate never touches the channel: it merges
      # into an EMPTY one, so its slice is a complete signed per-arch repository of its own —
      # the same artifact shape, consumed by the same publish job.
      - name: Index the channel slice, signed (cumulative for production; local for a candidate)
        env:
          ARCH: ${{ matrix.arch }}
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
        run: |
          if [ "$CANDIDATE" = "true" ]; then
            base="none"
            mkdir -p "site/apk/$ARCH"
          else
            # Three outcomes, told apart on purpose: the branch exists (merge against it), the
            # branch does not exist yet (first publish: start an orphan), or the remote could not
            # be queried (stop — guessing "first publish" here would let a network blip build an
            # index that forgets every published apk). Explicit refspec: actions/checkout's
            # single-ref fetch leaves `git fetch origin gh-pages` in FETCH_HEAD only, and
            # origin/gh-pages unresolvable (verified on a depth-1 single-branch clone).
            rc=0; git ls-remote --exit-code --heads origin gh-pages >/dev/null || rc=$?
            case "$rc" in
              0) git fetch --no-tags origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
                 base="$(git rev-parse origin/gh-pages)"
                 git worktree add site origin/gh-pages ;;
              2) base="none"
                 git worktree add --detach site
                 git -C site checkout --orphan gh-pages
                 git -C site rm -rf --quiet . 2>/dev/null || true ;;
              *) echo "::error::could not query origin for the gh-pages branch (git ls-remote exit $rc) — not building a cumulative index blind"; exit 1 ;;
            esac
          fi
          # The immutability rule lives in ONE tested script (packages/cli/test/apk-channel-merge.test.ts):
          # identical bytes skip, differing provenance keeps the first, differing apk REFUSES
          # before anything is copied. It writes the names it added.
          sh scripts/apk-channel-merge.sh "site/apk/$ARCH" "packages/$ARCH" added.txt
          (cd "site/apk/$ARCH" && melange index -o APKINDEX.tar.gz --signing-key "$GITHUB_WORKSPACE/melange.rsa" ./*.apk)
          # The slice the publish job places: ONLY what this merge added plus the re-signed
          # index — never the whole channel, which would make every artifact grow with history.
          rm -rf slice && mkdir -p slice
          cp "site/apk/$ARCH/APKINDEX.tar.gz" slice/
          while IFS= read -r name; do cp "site/apk/$ARCH/$name" slice/; done < added.txt
          printf '%s\n' "$base" > slice-base.sha
          echo "slice for $ARCH: $(wc -l < added.txt) added file(s) + signed index, indexed against gh-pages $base"

      - name: Scrub the signing key
        if: ${{ always() }}
        run: rm -f melange.rsa tripwire.rsa

      # ONE artifact shape for both release kinds: the files this build ADDED to the arch's
      # channel (apk + its SLSA provenance — listed explicitly by the merge script, so the
      # `*.apk*` glob that once silently dropped the .attest.tar.gz cannot recur), the signed
      # index, and the gh-pages commit it was indexed against ("none" for a candidate).
      - name: Upload the slice (added files + signed index + base commit)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-${{ matrix.arch }}
          path: |
            slice/*
            slice-base.sha
          if-no-files-found: error
          retention-days: 7

  publish:
    # ONE publish job for both release kinds, holding NO secret and no environment: melange-build
    # already signed everything this job places or composes. The kinds differ in four `if`-gated
    # steps and one tag: production places the slices into the Pages repository (staleness-
    # guarded), pushes, waits for Pages, and adds :latest; a candidate composes from the slices
    # as a local repository and pushes :vX.Y.Z-rc.N only, so the Pages channel never carries a
    # candidate. Every other step is shared — so every rc rehearses the job production runs.
    # (Until 2026-08-21 these were two jobs, apko-publish and production-publish, duplicating
    # toolchain/pin/publish/attest; the second also re-signed the index, which made it the
    # second key holder and the second reviewer gate.)
    #
    # Re-runs: production refuses to merge a slice if gh-pages moved since melange-build indexed
    # it (stale cumulative index) — re-run the whole workflow. A re-run after a FAILED publish is
    # safe: unchanged branch, idempotent steps (unchanged tree → no push; re-composing moves the
    # tags to a fresh attested digest).
    needs: [plan, melange-build]
    outputs:
      image-digest: ${{ steps.image.outputs.digest }}
    runs-on: ubuntu-latest
    # Same digest-pinned toolchain image as melange-build, NO --privileged: apko is daemonless
    # (it assembles the OCI image from apks and pushes over HTTPS). Tools come from Wolfi's
    # signed repo; nothing here has a config file to resolve.
    container:
      image: cgr.dev/chainguard/wolfi-base@sha256:8e8fe4b9b989b03daaa4305dba54a1b480f63716c56dc6bb074e5a6057bf3c73
    timeout-minutes: 45
    permissions:
      contents: write # gh-pages push — the production step; a candidate run never reaches it
      packages: write # ghcr push
      id-token: write
      attestations: write
    steps:
      # GNU coreutils/grep/sed: `seq`, `grep -o`, `sed` — not a bet on which applets this busybox
      # enables. tar is busybox's (Wolfi has no `tar` package; naming one aborts the whole
      # `apk add` — learned on the v0.4.0 backfill), and its `-Oxz` extraction is verified in the
      # official image. curl: the Pages wait. libgcc + libstdc++: the runner's own mounted node
      # that executes the JS actions (see melange-build's note). No melange: nothing is signed
      # here.
      - name: Install the publish toolchain (Wolfi signed apk repo)
        shell: sh
        run: apk add --no-cache bash apko coreutils curl git grep libgcc libstdc++ sed yq

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — main: for packaging/{melange.rsa.pub,cork-cli.apko.yaml}

      - name: Trust the bind-mounted workspace
        run: |
          # The workspace belongs to the runner (uid 1001) and git runs as root in here;
          # actions/checkout trusts it only inside its own temporary config, so every later git
          # call fails "dubious ownership" (v0.4.0 backfill, run 32433639047). Once, up front;
          # the site worktree under it needs no entry of its own (verified).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk-x86_64
          path: incoming/x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk-aarch64
          path: incoming/aarch64

      - name: Check the slices
        run: |
          # Each slice: the files melange-build ADDED for the arch, the ONE signed index it
          # computed (over the whole channel for production, over the slice for a candidate),
          # and the gh-pages commit it indexed against ("none" for candidates and first publish).
          for arch in x86_64 aarch64; do
            test -f "incoming/$arch/slice/APKINDEX.tar.gz" || { echo "::error::the $arch slice carries no signed index"; exit 1; }
            test -s "incoming/$arch/slice-base.sha" || { echo "::error::the $arch slice carries no base commit"; exit 1; }
            echo "$arch: $(find "incoming/$arch/slice" -type f | wc -l) file(s), indexed against gh-pages $(cat "incoming/$arch/slice-base.sha")"
          done

      - name: Check out (or initialize) the gh-pages apk repository (production)
        if: ${{ needs.plan.outputs.candidate == 'false' }}
        run: |
          # Same tri-state as melange-build's index step: branch present / absent (first publish)
          # / remote unreachable (stop). Explicit refspec: on actions/checkout's single-ref clone
          # a plain `git fetch origin gh-pages` leaves origin/gh-pages unresolvable (caught by the
          # CI-shaped simulation, 2026-08-21).
          rc=0; git ls-remote --exit-code --heads origin gh-pages >/dev/null || rc=$?
          case "$rc" in
            0) git fetch --no-tags origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
               now="$(git rev-parse origin/gh-pages)"
               git worktree add site origin/gh-pages ;;
            2) now="none"
               git worktree add --detach site
               git -C site checkout --orphan gh-pages
               git -C site rm -rf --quiet . 2>/dev/null || true ;;
            *) echo "::error::could not query origin for the gh-pages branch (git ls-remote exit $rc)"; exit 1 ;;
          esac
          echo "GHPAGES_NOW=$now" >> "$GITHUB_ENV"
          mkdir -p site/apk/x86_64 site/apk/aarch64
          # Pages serves this branch raw. Without .nojekyll, Pages runs Jekyll over the tree,
          # and Jekyll's Liquid pass rejects literal {% sequences in any markdown it finds.
          touch site/.nojekyll

      - name: Place the signed slices into the Pages repository (production; staleness-guarded)
        if: ${{ needs.plan.outputs.candidate == 'false' }}
        run: |
          # Immutability was enforced in melange-build against the recorded commit — so placing
          # the slice is only correct if the branch has not moved since.
          for arch in x86_64 aarch64; do
            base="$(cat "incoming/$arch/slice-base.sha")"
            if [ "$base" != "$GHPAGES_NOW" ]; then
              echo "::error::gh-pages moved since melange-build indexed $arch against it (indexed at $base, branch now at $GHPAGES_NOW) — the cumulative index is stale; re-run the whole workflow, not this job"
              exit 1
            fi
            cp -a "incoming/$arch/slice/." "site/apk/$arch/"
            set -- "site/apk/$arch"/*.apk
            echo "$arch: placed; channel now holds $# apk(s)"
          done
          cp packaging/melange.rsa.pub site/melange.rsa.pub

      - name: Publish (push gh-pages; Pages serves the branch) (production)
        if: ${{ needs.plan.outputs.candidate == 'false' }}
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to publish — Pages already current (re-run)"
          else
            git commit -m "apk repo: add cork-cli $TAG"
            git push origin HEAD:gh-pages
          fi

      - name: Wait for Pages to serve the new package (production)
        if: ${{ needs.plan.outputs.candidate == 'false' }}
        env:
          APKVER: ${{ needs.plan.outputs.apkver }}
        run: |
          url="https://cork-technology.github.io/cork-cli/apk/x86_64/APKINDEX.tar.gz"
          for i in $(seq 1 60); do
            if curl -fsSL "$url" | tar -Oxz APKINDEX 2>/dev/null | grep -q "V:${APKVER}"; then
              echo "Pages serves ${APKVER}"; exit 0
            fi
            echo "waiting for Pages deploy ($i/60)…"; sleep 15
          done
          echo "Pages never served ${APKVER}" >&2; exit 1

      - name: Point the spec at the local slices (candidate)
        if: ${{ needs.plan.outputs.candidate == 'true' }}
        run: |
          # The Pages channel never carries a candidate: each slice IS a signed per-arch
          # repository (apks + APKINDEX.tar.gz), so the image composes from them as a local repo.
          # The wolfi repo stays as-is; only the cork-cli repo/keyring pair is swapped.
          for arch in x86_64 aarch64; do
            mkdir -p "local/$arch" && cp -a "incoming/$arch/slice/." "local/$arch/"
          done
          yq -i '(.contents.repositories[] | select(. == "https://cork-technology.github.io/cork-cli/apk")) = "./local"' packaging/cork-cli.apko.yaml
          yq -i '(.contents.keyring[] | select(. == "https://cork-technology.github.io/cork-cli/melange.rsa.pub")) = "./packaging/melange.rsa.pub"' packaging/cork-cli.apko.yaml
          yq '.contents.repositories, .contents.keyring' packaging/cork-cli.apko.yaml

      - name: Pin the apk version and stamp the annotations
        env:
          APKVER: ${{ needs.plan.outputs.apkver }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # An independent `apko build` of this spec must resolve the SAME package as this run —
          # pin cork-cli to the exact version-revision instead of floating on the index head.
          # (epoch is 0 in melange.yaml; a future epoch bump must be mirrored here.)
          PIN="cork-cli=${APKVER}-r0" \
          yq -i '(.contents.packages[] | select(. == "cork-cli")) = strenv(PIN)' packaging/cork-cli.apko.yaml
          yq '.contents.packages' packaging/cork-cli.apko.yaml
          # OCI annotations a verifier reads without pulling the SBOM: the static ones live in the
          # spec; version and revision are the RELEASE's. The revision is the tag's commit, not
          # github.sha — on a backfill dispatched from main they differ, and the image must name
          # the source it was built from.
          git fetch -q --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          rev="$(git rev-parse "$TAG^{commit}")"
          ANN_VERSION="$TAG" ANN_REVISION="$rev" \
          yq -i '.annotations["org.opencontainers.image.version"] = strenv(ANN_VERSION) | .annotations["org.opencontainers.image.revision"] = strenv(ANN_REVISION)' packaging/cork-cli.apko.yaml
          yq '.annotations' packaging/cork-cli.apko.yaml

      - name: Build + push the image
        id: image
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          # Three guards proven necessary on the v0.3.0-rc.1 backfill: pipefail so an apko failure
          # cannot hide behind tee, the sboms/ dir apko expects but never creates, and a loud stop
          # on an empty captured digest.
          set -o pipefail
          mkdir -p sboms
          owner="$(echo "$GH_OWNER" | tr '[:upper:]' '[:lower:]')"
          # :latest tracks production only (G9/R7). While the component is pre-1.0 (v0.x.y) it is
          # partner-preview, so it never moves :latest; only a bare v1.0.0+ tag does. Candidates never do.
          tags="ghcr.io/$owner/cork-cli:$TAG"
          case "$TAG" in v0.*|*-*) : ;; *) tags="$tags ghcr.io/$owner/cork-cli:latest" ;; esac
          echo "publishing: $tags"
          apko login ghcr.io -u "${{ github.actor }}" -p "${{ github.token }}"
          # shellcheck disable=SC2086 # $tags is a deliberate word list
          apko publish packaging/cork-cli.apko.yaml $tags --sbom-path sboms/ | tee digest.txt
          # apko prints the pushed ref with digest as the last line: capture for attestation
          # (env, this job) and for the deploy job (step output → job output).
          digest="$(grep -o 'sha256:[0-9a-f]\{64\}' digest.txt | tail -1)"
          test -n "$digest" || { echo "::error::no image digest captured from apko output — refusing to hand the attest step an empty subject"; exit 1; }
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/$owner/cork-cli" >> "$GITHUB_ENV"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the image digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

  deploy-cvm:
    # The ONE reviewer gate of a production release. By the time this asks, the apk channel
    # and the image are published and attested; approving means exactly "run this attested
    # digest on the production CVM". A Phala failure marks the run red and undoes nothing —
    # re-run THIS job alone to retry (the publish job need not repeat). Split out of
    # production-publish on 2026-08-21 so the deploy credential lives in one small job.
    #
    # Phala notes (Phase 2b of the remote-MCP plan): the CVM runs the EXACT attested digest —
    # the compose is digest-pinned (verification breaks on tags) and its runtime secrets live
    # as encrypted CVM secrets in the Phala dashboard, never in the compose or this workflow.
    # Third-party verification: packaging/VERIFY.md + scripts/verify-deployment.ts (six checks:
    # quote signature, RTMR3 replay, compose-hash, digest pinning, gh attestation link).
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.candidate == 'false' }}
    environment: release # PHALA_CLOUD_API_KEY
    runs-on: ubuntu-latest
    container:
      image: cgr.dev/chainguard/wolfi-base@sha256:8e8fe4b9b989b03daaa4305dba54a1b480f63716c56dc6bb074e5a6057bf3c73
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # nodejs + npm: the phala CLI (exact-pinned below); GNU sed/grep for the digest
      # substitution and its check; libgcc + libstdc++ for the runner's mounted node.
      - name: Install the deploy toolchain (Wolfi signed apk repo)
        shell: sh
        run: apk add --no-cache bash coreutils git grep libgcc libstdc++ nodejs npm sed

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — main: for packaging/phala-compose.yml

      - name: Substitute the attested digest into the compose
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.image-digest }}
        run: |
          test -n "$IMAGE_DIGEST" || { echo "::error::no image digest handed over from production-publish" >&2; exit 1; }
          sed "s|\${DIGEST}|$IMAGE_DIGEST|" packaging/phala-compose.yml > phala-compose.deploy.yml
          grep -q "@sha256:[0-9a-f]\{64\}" phala-compose.deploy.yml || { echo "compose image is not digest-pinned after substitution" >&2; exit 1; }
          grep "image:" phala-compose.deploy.yml

      - name: Deploy the CVM (name-keyed in-place update)
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          test -n "$PHALA_CLOUD_API_KEY" || { echo "PHALA_CLOUD_API_KEY is not set in the 'release' environment — see the blocked-on-owner list in packaging/VERIFY.md" >&2; exit 1; }
          # Exact-pinned + scripts disabled: this job holds PHALA_CLOUD_API_KEY, so a floating
          # `latest` here would hand deploy credentials to whoever ships the next phala release.
          # Bump deliberately, next to the lockfile pins.
          npm install -g --ignore-scripts phala@1.1.20
          phala deploy -c phala-compose.deploy.yml -n cork-mcp --wait
