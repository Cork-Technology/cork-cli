# Reusable single-binary build. Holding the build steps in
# a REUSABLE workflow is what lifts the artifact attestations to SLSA v1 Build L3 — verifiers pin
# it with:  gh attestation verify <asset> --repo Cork-Technology/cork-cli \
#            --signer-workflow Cork-Technology/cork-cli/.github/workflows/build-binaries.yml
# (`ch self-update` runs exactly that check; keep this filename stable.)
#
# Reproducibility contract: same commit + same Bun (exact pin in mise.toml) + the fixed asset
# names from scripts/compile-binaries.mjs => byte-identical binaries. release.yml calls this
# twice on independent runners and refuses to publish unless both runs' checksums agree.
name: build-binaries

on:
  workflow_call:
    inputs:
      version:
        description: "release version to stamp (vX.Y.Z[-rc.N])"
        required: true
        type: string
      attest:
        description: "generate build-provenance attestations for the binaries"
        required: false
        type: boolean
        default: false
      artifact-name:
        description: "name for the uploaded artifact bundle"
        required: false
        type: string
        default: binaries

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain from mise.toml — the ONE place the Bun version is pinned.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck + offline tests
        env:
          CORK_CONFIG_NO_FETCH: "1"
        run: |
          bun run typecheck
          bun run test:unit

      # SDK tarballs ride the same reproducibility contract as the binaries: `bun pm pack` emits
      # byte-identical tarballs across independent rebuilds (verified empirically — mtimes are
      # normalized), rewrites `workspace:*` to the pinned versions, and the determinism gate in
      # release.yml diffs their checksums exactly like the binaries'. Pack BEFORE compiling: the
      # package build stages into the root dist/ and would clobber compiled binaries placed there.
      - name: Build, gate, and pack the SDK tarballs (@cork/schemas, @cork/core, @cork/mcp)
        run: |
          bun run verify:publish
          mkdir -p sdk-tarballs
          for p in schemas core mcp; do
            (cd "packages/$p" && bun pm pack --quiet --destination "$GITHUB_WORKSPACE/sdk-tarballs")
          done
          node scripts/build-packages.mjs --clean-only

      - name: Compile release binaries (all targets, cross-compiled)
        run: bun scripts/compile-binaries.mjs --version "${{ inputs.version }}" --commit "${{ github.sha }}" --outdir dist

      - name: Add the SDK tarballs to the release set
        run: |
          mv sdk-tarballs/cork-*.tgz dist/
          (cd dist && sha256sum cork-*.tgz >> checksums.txt)

      - name: Attest build provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/ch-*
            dist/cork-*.tgz
            dist/checksums.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
